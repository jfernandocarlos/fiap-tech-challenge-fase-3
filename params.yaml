# Hiperparâmetros do pipeline de triagem (fonte de verdade para ML).
# Infraestrutura (API, paths, chaves) fica no .env via Settings.

data:
  test_size: 0.2
  min_text_length: 20

model:
  max_features: 3000
  ngram_range: [1, 2]
  max_iter: 1000
  n_estimators_baseline: 100

train:
  random_seed: 42

benchmark:
  n_requests: 200
  warmup: 20
