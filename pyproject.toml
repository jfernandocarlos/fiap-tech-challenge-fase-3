[tool.poetry]
name = "medical-triage-api"
version = "1.0.0"
description = "API de triagem de laudos médicos — NLP, CI/CD, Prometheus/Grafana e ONNX"
authors = ["Seu Nome <seu@email.com>"]
readme = "README.md"
packages = [{ include = "triage", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pydantic-settings = "2.6.1"
python-dotenv = "1.0.1"
structlog = "24.4.0"
pyyaml = "6.0.2"
pandas = "2.2.3"
numpy = "1.26.4"
scikit-learn = "1.5.2"
joblib = "1.4.2"
fastapi = "0.115.6"
uvicorn = {version = "0.32.1", extras = ["standard"]}
prometheus-client = "0.21.1"
onnxruntime = "1.20.1"
skl2onnx = "1.17.0"
onnx = "1.16.2"

[tool.poetry.group.dev.dependencies]
ruff = "0.8.4"
pytest = ">=8.0"
pre-commit = ">=4.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts", "airflow"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
